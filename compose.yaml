services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/clauseguard.db
      UPLOAD_DIR: /data/uploads
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - clauseguard_data:/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "3000:80"
  qdrant:
    image: qdrant/qdrant:v1.11.5
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
volumes:
  clauseguard_data:
  qdrant_data:
